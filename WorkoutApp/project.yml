name: WorkoutApp
options:
  bundleIdPrefix: com.ansoncordeiro
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WorkoutApp:
    type: application
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - WorkoutApp
    resources:
      - WorkoutApp/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ansoncordeiro.WorkoutApp
        DEVELOPMENT_TEAM: FNZS4MVS45
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "I'd Lift That"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  WorkoutAppTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations:
      - iOS
    sources:
      - path: WorkoutAppTests
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WorkoutApp
schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
        WorkoutAppTests: [test]
    test:
      targets:
        - WorkoutAppTests
